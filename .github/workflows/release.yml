name: release

# Stable channel: versioned, immutable, non-prerelease GitHub Releases
# from semantic version tags. Never runs from branches or PRs.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  stable:
    name: stable release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ref ${GITHUB_REF_NAME} is not a stable semantic version tag; refusing."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The production UI must be built before GoReleaser embeds it.
      # A binary without the real UI is a broken release.
      - run: npm --prefix web ci
      - run: npm --prefix web run build

      - run: go test ./...
      - run: go vet ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: stable
