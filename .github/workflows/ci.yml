name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: backend (no frontend build)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Runs on a clean checkout WITHOUT web/dist built: web/dist holds
      # only the tracked placeholder, so this also locks the go:embed
      # fallback behavior (control UI answers 503, API stays green).
      - run: go test ./...
      - run: go vet ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  production:
    name: production build + smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o ai-lb ./cmd/ai-lb
      - run: |
          ./ai-lb --data-dir "$RUNNER_TEMP/ailb-data" &
          SRV=$!
          trap 'kill $SRV' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8317/api/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8317/ | grep -o '<div id="root">'
          curl -fsS http://127.0.0.1:8318/health | grep -o '"status":"ok"'
          curl -fsS http://127.0.0.1:8317/api/health | grep -o '"status":"ok"'
